
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosso Quebra-Cabeça</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: #ffeef0;
      color: #6b1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 2em;
      color: #d6336c;
    }
    #puzzle {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-gap: 1px;
      margin: 20px 0;
    }
    .piece {
      width: 100px;
      height: 100px;
      background-color: #fcddec;
      background-size: 1000px 1000px;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .revealed {
      opacity: 1;
    }
    #question-box {
      background: #fff0f5;
      border: 2px dashed #d6336c;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      text-align: center;
    }
    .option {
      margin: 10px 0;
      padding: 10px;
      background: #ffe3ec;
      border: 1px solid #d6336c;
      border-radius: 8px;
      cursor: pointer;
    }
    .option:hover {
      background: #ffd2dd;
    }
    #final-message {
      display: none;
      background: #fff0f5;
      border: 2px solid #d6336c;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 1.3em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Nosso Quebra-Cabeça de Amor</h1>
  <div id="question-box"></div>
  <div id="puzzle"></div>
  <div id="final-message">Parabéns, meu campeãozinho! Sabia que você ia conseguir! Muito bom namorar uma pessoa linda e inteligente. Te amo demais!</div>
  <script>
    const questions = [
      {
        question: "Qual a cor da camisa eu estava usando no nosso primeiro encontro?",
        options: ["Branco", "Azul", "Preto", "Laranja"],
        answer: "Preto"
      },
      {
        question: "Qual foi o dia da semana do nosso primeiro encontro:",
        options: ["Segunda", "Terça", "Quarta", "Quinta"],
        answer: "Quinta"
      },
      {
        question: "Qual foi o presente que eu te dei que eu mais gostei de montar?",
        options: ["Caixa de 1 mês", "Sacolinha de 2 meses", "Atividade surpresa"],
        answer: "Atividade surpresa"
      },
      {
        question: "Que data eu ia te pedir em namoro?",
        options: ["14/01", "17/01", "15/02", "17/02"],
        answer: "17/02"
      },
      {
        question: "Qual música eu acho que mais combina com a nossa história?",
        options: ["Ter o coração no chão, Anavitoria", "Call it what you want, Taylor Swift", "Veludo marrom, Liniker", "Amuleto, Tie"],
        answer: "Ter o coração no chão, Anavitoria"
      },
      {
        question: "Em que momento eu soube que estava apaixonadinho por você?",
        options: ["Você acordando depois de modern family", "Você me chamando de amor pela primeira vez", "Nossa ligação na praia", "Nosso primeiro encontro"],
        answer: "Você acordando depois de modern family"
      },
      {
        question: "Quantas horas a gente passou em ligação na praia?",
        options: ["4h45", "5h30", "6h20", "7h"],
        answer: "6h20"
      },
      {
        question: "Para quais amigos meus eu falei de você primeiro?",
        options: ["Paula e Gabi", "Bruna", "Wilton", "Bia"],
        answer: "Paula e Gabi"
      },
      {
        question: "O que eu mais amo que você faça?",
        options: ["Cante pra mim", "Me desafie", "Veja musicais comigo", "Cozinhe pra mim"],
        answer: "Cante pra mim"
      },
      {
        question: "Quem é o amor da minha vida?",
        options: ["Fernanda Pessoa", "Manoel Neto", "Ilka Keith", "Allan sotero"],
        answer: "Allan sotero"
      }
    ];

    const puzzle = document.getElementById('puzzle');
    const questionBox = document.getElementById('question-box');
    const finalMessage = document.getElementById('final-message');
    let current = 0;
    let revealed = 0;
    const totalPieces = 100;

    for (let i = 0; i < totalPieces; i++) {
      const piece = document.createElement('div');
      piece.classList.add('piece');
      piece.style.backgroundImage = "url('quebra_cabeca_100p.png')";
      const x = (i % 10) * -100;
      const y = Math.floor(i / 10) * -100;
      piece.style.backgroundPosition = `${x}px ${y}px`;
      puzzle.appendChild(piece);
    }

    const pieces = document.querySelectorAll('.piece');

    function showQuestion() {
      const q = questions[current];
      if (!q) return;
      questionBox.innerHTML = `<h3>${q.question}</h3>`;
      q.options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt === q.answer);
        questionBox.appendChild(btn);
      });
    }

    function checkAnswer(isCorrect) {
      const toReveal = isCorrect ? 10 : 5;
      let revealedNow = 0;
      for (let i = 0; i < pieces.length && revealedNow < toReveal; i++) {
        if (!pieces[i].classList.contains('revealed')) {
          pieces[i].classList.add('revealed');
          revealedNow++;
        }
      }
      revealed += revealedNow;
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        questionBox.style.display = 'none';
        if (revealed >= totalPieces) {
          finalMessage.style.display = 'block';
        }
      }
    }

    showQuestion();
  </script>
</body>
</html>
