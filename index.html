<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quebra-Cabeça Interativo</title>
  <style>
    body {
      background: #fce4ec;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #puzzle {
      width: 500px;
      height: 500px;
      background: #fff;
      border: 10px solid #f06292;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
  </style>
</head>
<body>
  <div id="puzzle">
    <canvas id="puzzle-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('puzzle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 500;
    canvas.height = 500;

    const image = new Image();
    image.src = 'quebra_cabeca_100p.png'; // já está no seu repositório

    let pieces = [];
    const rows = 10, cols = 10;
    const pieceW = canvas.width / cols;
    const pieceH = canvas.height / rows;

    image.onload = () => {
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          pieces.push({
            x,
            y,
            imgX: x * pieceW,
            imgY: y * pieceH,
            placed: false,
            offsetX: Math.random() * (canvas.width - pieceW),
            offsetY: Math.random() * (canvas.height - pieceH)
          });
        }
      }
      draw();
    };

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let piece of pieces) {
        ctx.drawImage(
          image,
          piece.imgX, piece.imgY, pieceW, pieceH,
          piece.offsetX, piece.offsetY, pieceW, pieceH
        );
      }
    }

    let selected = null, offset = {};

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      for (let piece of pieces) {
        if (
          mx > piece.offsetX &&
          mx < piece.offsetX + pieceW &&
          my > piece.offsetY &&
          my < piece.offsetY + pieceH
        ) {
          selected = piece;
          offset.x = mx - piece.offsetX;
          offset.y = my - piece.offsetY;
          break;
        }
      }
    });

    canvas.addEventListener('mousemove', e => {
      if (selected) {
        const rect = canvas.getBoundingClientRect();
        selected.offsetX = e.clientX - rect.left - offset.x;
        selected.offsetY = e.clientY - rect.top - offset.y;
        draw();
      }
    });

    canvas.addEventListener('mouseup', () => {
      selected = null;
    });
  </script>
</body>
</html>
